# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: OMP, Bun, and Claude Code
description: Pinned coding agents and sandbox language tools, installed at image build time.
requires:
  - dk.tecklab/base >= 1
provides:
  - omp@19.0.1
  - bun@1.4.4
  - claude-code@2.1.330
  - mcp-debugger@0.26.0
capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: install -d -o agent -g agent -m 700 /home/agent/.omp /home/agent/.omp/run /home/agent/.bun/install/cache
          user: "0"
          description: Initialize writable OMP session and Bun cache directories.
        - command: claude plugin marketplace add /opt/teck-claude-marketplace && claude plugin install teck-code-tools@teck-sandbox --scope user
          user: agent
          description: Install sandbox language servers and debugger plugin for Claude Code.
