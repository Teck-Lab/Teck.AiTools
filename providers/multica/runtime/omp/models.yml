providers:
  litellm:
    baseUrl: http://127.0.0.1:8787/v1
    api: openai-completions
    apiKey: LITELLM_API_KEY
    authHeader: true
    headers:
      x-headroom-base-url: https://litellm.tecklab.dk
    models:
      - id: gpt-6.2-sol
        name: GPT 6.2 Sol
        api: openai-responses
        contextWindow: 500000
        maxTokens: 32768
        reasoning: true
        input: [text, image]
        thinking: { mode: effort, efforts: [low, medium, high, xhigh, max], defaultLevel: high }
      - id: gpt-6.2-astra
        name: GPT 6.2 Astra
        api: openai-responses
        contextWindow: 500000
        maxTokens: 32768
        reasoning: true
        input: [text, image]
        thinking: { mode: effort, efforts: [low, medium, high, xhigh, max], defaultLevel: medium }
      - id: deepseek-v4.1-flash
        name: DeepSeek V4.1 Flash
        api: openai-completions
        compat: { sessionHeader: x-litellm-session-id, supportsReasoningEffort: false }
        contextWindow: 700000
        maxTokens: 32768
        input: [text, image]
      - id: gpt-6-luna
        name: GPT 6 Luna
        api: openai-responses
        contextWindow: 700000
        maxTokens: 32768
        reasoning: true
        input: [text, image]
        thinking: { mode: effort, efforts: [low, medium, high, xhigh, max], defaultLevel: low }
