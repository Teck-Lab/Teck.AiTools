# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Model provider network access
description: Permit Multica-managed model API keys without host-side kit secrets.
provides:
  - dk.tecklab/omniroute-access@1
capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - omniroute.tecklab.dk:443
          - api.anthropic.com:443
          - api.openai.com:443
          - api.openrouter.ai:443
          - generativelanguage.googleapis.com:443
