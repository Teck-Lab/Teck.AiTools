# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Multica daemon
description: Pinned Multica CLI, shared OMP skills and Hindsight memory, and startup hook.
requires:
  - dk.tecklab/base >= 1
  - omp >= 18.20.0
provides:
  - dk.tecklab/multica@0.9.0
args:
  appHost:
    required: true
    pattern: '^[A-Za-z0-9.-]+$'
  serverHost:
    required: true
    pattern: '^[A-Za-z0-9.-]+$'
capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - "${{ kit.args.appHost }}:443"
          - "${{ kit.args.serverHost }}:443"
          - api.anthropic.com:443
          - api.openai.com:443
          - api.openrouter.ai:443
          - generativelanguage.googleapis.com:443
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: install -d -o agent -g agent -m 700 /home/agent/.multica /home/agent/multica_workspaces
          user: "0"
          description: Initialize Multica state and run directories without credentials.
        - command: install -d -o agent -g agent -m 700 /home/agent/.omp/agent && install -o agent -g agent -m 600 /usr/local/share/teck-multica/models.yml /home/agent/.omp/agent/models.yml
          user: "0"
          description: Install the shared Teck OMP model catalog without provider keys.
        - command: install -o agent -g agent -m 600 /usr/local/share/teck-multica/config.yml /home/agent/.omp/agent/config.yml
          user: "0"
          description: Enable native Hindsight memory for OMP agents.
        - command: install -o agent -g agent -m 600 /usr/local/share/teck-multica/WATCHDOG.md /home/agent/.omp/agent/WATCHDOG.md && install -o agent -g agent -m 600 /usr/local/share/teck-multica/WATCHDOG.yml /home/agent/.omp/agent/WATCHDOG.yml
          user: "0"
          description: Install Multica-specific OMP advisor guidance and roster.
        - command: install -d -o agent -g agent -m 700 /home/agent/.omp/agent/agents && cp -R /usr/local/share/teck-multica/agents/. /home/agent/.omp/agent/agents/ && chown -R agent:agent /home/agent/.omp/agent/agents
          user: "0"
          description: Install the independent OMP quality reviewer for Multica.
        - command: install -d -o agent -g agent -m 700 /home/agent/.omp/agent/skills && cp -R /usr/local/share/teck-multica/skills/. /home/agent/.omp/agent/skills/ && chown -R agent:agent /home/agent/.omp/agent/skills
          user: "0"
          description: Install reusable OMP skills for Multica runtime discovery.
        - command: multica config set app_url "https://${{ kit.args.appHost }}" && multica config set server_url "https://${{ kit.args.serverHost }}"
          user: agent
          description: Configure the self-hosted Multica server before the first login.
      startup:
        - command: [/bin/sh, /usr/local/lib/teck-multica/start-daemon.sh, "${{ kit.args.appHost }}", "${{ kit.args.serverHost }}"]
          user: agent
          background: true
          env: [TECK_MULTICA_SANDBOX_NAME, SANDBOX_NAME]
          description: Configure Multica and start its daemon automatically once authenticated.
