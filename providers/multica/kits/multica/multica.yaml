# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Multica daemon
description: Pinned Multica CLI and startup hook for the built-in OMP runtime.
requires:
  - dk.tecklab/base >= 1
  - omp >= 18.20.0
provides:
  - dk.tecklab/multica@0.9.0
args:
  appHost:
    required: true
    pattern: '^[A-Za-z0-9.-]+$'
  serverHost:
    required: true
    pattern: '^[A-Za-z0-9.-]+$'
capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - "${{ kit.args.appHost }}:443"
          - "${{ kit.args.serverHost }}:443"
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: install -d -o agent -g agent -m 700 /home/agent/.multica /home/agent/multica_workspaces
          user: "0"
          description: Initialize Multica state and run directories without credentials.
      startup:
        - command: /bin/sh /usr/local/lib/teck-multica/start-daemon.sh
          user: agent
          description: Start the Multica daemon when this sandbox has been authenticated.
