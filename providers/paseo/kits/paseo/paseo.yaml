# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Paseo daemon
description: Pinned Paseo CLI and guest setup for the official OMP plugin.
requires:
  - dk.tecklab/base >= 1
  - omp >= 18.20.0
provides:
  - dk.tecklab/paseo@0.15.4
capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - paseo.sh:443
          - registry.npmjs.org:443
