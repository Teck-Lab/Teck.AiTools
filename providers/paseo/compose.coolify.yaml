services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: paseo_hub
      POSTGRES_USER: paseo
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - hub-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paseo -d paseo_hub"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  hub:
    image: ${PASEO_HUB_IMAGE:-ghcr.io/getpaseo/hub:latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVICE_URL_HUB_3000: /
      DATABASE_URL: postgres://paseo:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/paseo_hub
      PORT: "3000"
      PASEO_HUB_APP_URL: ${SERVICE_URL_HUB_3000}
      PASEO_HUB_TRUSTED_CLIENT_IP_HEADER: x-forwarded-for
      PASEO_REGISTRATION_MODE: ${PASEO_REGISTRATION_MODE:-invite_only}
      PASEO_ORGANIZATION_CREATION: ${PASEO_ORGANIZATION_CREATION:-disabled}
    expose:
      - "3000"
    networks:
      - hub-data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]

volumes:
  postgres-data:

networks:
  hub-data:
